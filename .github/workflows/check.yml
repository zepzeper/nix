# Every push and pull request: formatting, lints, and every host and variant
# must evaluate (`nix flake check`). Employee laptops install whatever lands
# on main, so make this a required status check for main in the repository
# settings (Settings -> Branches -> Branch protection rules).
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs
