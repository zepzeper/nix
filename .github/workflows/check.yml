# Every push and pull request: formatting, lints, and every host and variant
# must evaluate (`nix flake check`). Employee laptops install whatever lands
# on main, so make this a required status check for main in the repository
# settings (Settings -> Branches -> Branch protection rules).
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix flake check --print-build-logs
