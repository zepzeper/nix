; PHP settings for Kodai on a server: the values of its docker/php/php.ini
; and php.production.ini (the Dockerfile's production target) together, plus
; what the NixOS setup needs.

memory_limit = 256M

; Move together: post_max_size caps the whole request body.
upload_max_filesize = 50M
post_max_size = 50M

max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
; A deployed release: never stat a file again after compiling it. The deploy
; reloads PHP-FPM, which is what picks up new code.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; No stack traces to visitors; errors go to PHP-FPM's log (the journal).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
zend.assertions = -1

; DB_HOST=localhost: the MariaDB socket, where the kodai system user logs in
; as the kodai database user without a password.
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
