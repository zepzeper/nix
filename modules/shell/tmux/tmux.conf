set -g default-terminal "tmux-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1


bind e copy-mode

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# Copies to the system clipboard through the terminal (OSC 52): works on
# Wayland, where xclip does not, and in tmux on a server over SSH.
set -s set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind r source-file /etc/tmux.conf \; display-message "Config reloaded!"
bind -r o new-window -c '#{pane_current_path}'

bind f new-window tmux-sessionizer
bind i popup -E cheat
